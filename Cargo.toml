[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license-file = "LICENSE"
repository = "https://github.com/fabienlege/explorer"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
axum-extra = { version = "0.10", default-features = false, features = ["query"] }
http-body-util = "0.1"
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
cap-std = "4.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["trace", "request-id", "util", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json", "fmt", "ansi", "std"] }
explorer-shared = { path = "crates/shared" }
dioxus = { version = "0.7.10", default-features = false }
dioxus-i18n = "0.6"
fluent-syntax = "0.12"
unic-langid = { version = "0.9", features = ["macros"] }
web-sys = "0.3"
js-sys = "0.3"
unicode-normalization = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
humantime = "2.4"
secrecy = "0.10"
tempfile = "3"
thiserror = "2"
time = "0.3"
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { version = "0.15", default-features = false, features = ["sqlite"] }
url = "2.5"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rsa = { version = "0.9.10", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
http-range-header = "0.4"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
percent-encoding = "2"
httpdate = "1"
zip = { version = "9.0.5", default-features = false }
tokio-stream = { version = "0.1", default-features = false }

# RSA key generation in the test harness is unbearably slow unoptimised.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
