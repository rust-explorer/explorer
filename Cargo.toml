[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license-file = "LICENSE"
repository = "https://github.com/fabienlege/explorer"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "0.1"
rustix = { version = "1", default-features = false, features = ["process", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["trace", "request-id", "util", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json", "fmt", "ansi", "std"] }
explorer-shared = { path = "crates/shared" }
dioxus = { version = "0.7.10", default-features = false }
dioxus-i18n = "0.6"
fluent-syntax = "0.12"
unic-langid = { version = "0.9", features = ["macros"] }
web-sys = "0.3"
humantime = "2.4"
secrecy = "0.10"
tempfile = "3"
thiserror = "2"
url = "2.5"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
