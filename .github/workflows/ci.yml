name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_call:

concurrency:
  # github.workflow is the caller's name when Release calls this, so a release run and a
  # push run on the same ref do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Prebuilt dx binaries need glibc >= 2.39.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DX_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dx and cargo-audit
        run: |
          fetch() { curl -fsSL -o "$1" "$2" && echo "$3  $1" | sha256sum -c -; }
          tmp="$(mktemp -d)" && cd "$tmp"
          fetch dx.tgz https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz \
            4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7
          fetch audit.tgz https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf dx.tgz -C "$HOME/.cargo/bin" dx
          tar -xzf audit.tgz -C "$HOME/.cargo/bin" --strip-components=1 cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
      - name: Run checks
        run: cargo xtask ci --no-docker
